services:
  web:
    build: .
    image: codealpha-web-server:1.0.0
    container_name: codealpha-web
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped

    # Hardening: nothing in the image needs to be written at runtime except /tmp
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

    # Rotate the json log files so they can't fill up the disk
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
