name: Task 3 - Java Gradle CI/CD

on:
  push:
    branches: [main]
    paths:
      - "CodeAlpha_Java_Gradle_App/**"
      - ".github/workflows/task3-java-gradle.yml"
  pull_request:
    paths:
      - "CodeAlpha_Java_Gradle_App/**"
      - ".github/workflows/task3-java-gradle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task3-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: CodeAlpha_Java_Gradle_App
  IMAGE_NAME: task-tracker

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Caches Gradle dependencies/build cache and validates the wrapper jar checksum
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build, test and check coverage
        run: ./gradlew build --console=plain

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            ${{ env.APP_DIR }}/build/reports/tests/
            ${{ env.APP_DIR }}/build/reports/jacoco/
          retention-days: 14

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: task-tracker-dist
          path: |
            ${{ env.APP_DIR }}/build/libs/*.jar
            ${{ env.APP_DIR }}/build/distributions/*
          retention-days: 14

  docker:
    name: Docker image
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.APP_DIR }}
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name app -p 8080:8080 ${{ env.IMAGE_NAME }}:ci
          for i in $(seq 1 30); do
            curl -fs http://localhost:8080/health && break
            sleep 2
          done
          curl -fs http://localhost:8080/health | grep -q '"UP"'
          curl -fs -X POST http://localhost:8080/api/tasks -d '{"title":"smoke test"}' | grep -q '"id":1'
          curl -fs http://localhost:8080/api/stats | grep -q '"total":1'
          echo "Smoke test passed"
          docker logs app

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.APP_DIR }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
